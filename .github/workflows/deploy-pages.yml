# 每次推到 main，就自動把網站部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 也可以到 Actions 分頁手動按一下重跑

permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署，避免兩次推送互相蓋掉
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      # 注意：第一次使用前，要先到 Settings -> Pages，
      # 把 Source 設成「GitHub Actions」。這個開關只需要設定一次。
      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 打包整個網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
